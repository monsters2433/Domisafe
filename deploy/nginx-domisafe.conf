# =============================================================================
# Domisafe — configuración de Nginx (plantilla para HestiaCP)
#
# Parte A va a nivel `http`  ->  /etc/nginx/conf.d/domisafe-limits.conf
# Parte B va dentro del `server` del dominio (plantilla de proxy de Hestia o
#          /home/domisafe/conf/web/domisafe.org/nginx.conf_domisafe)
# =============================================================================


# -----------------------------------------------------------------------------
# PARTE A — /etc/nginx/conf.d/domisafe-limits.conf
# -----------------------------------------------------------------------------

# Con Cloudflare delante, $remote_addr es siempre una IP de Cloudflare.
# Sin esto, el rate limiting agruparía a TODOS los visitantes en una sola cubeta.
# Lista actualizada en https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# cloudflared corre en la propia máquina
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Zonas de rate limiting. 10m ~ 160.000 IPs, coste de memoria despreciable.
limit_req_zone $binary_remote_addr zone=domisafe_scan:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=domisafe_api:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=domisafe_web:10m  rate=120r/m;
limit_conn_zone $binary_remote_addr zone=domisafe_conn:10m;

limit_req_status 429;
limit_conn_status 429;

upstream domisafe_app {
    server 127.0.0.1:3000;
    keepalive 32;
}


# -----------------------------------------------------------------------------
# PARTE B — bloque de proxy dentro del `server` del dominio
# -----------------------------------------------------------------------------

# --- Estáticos inmutables de Next.js: los sirve Nginx, no Node ---------------
location /_next/static/ {
    proxy_pass http://domisafe_app;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# --- Endpoint de escaneo: el más caro, el más limitado -----------------------
location = /api/scan {
    limit_req zone=domisafe_scan burst=3 nodelay;
    limit_conn domisafe_conn 4;

    # El escaneo real puede tardar; no cortes antes de tiempo.
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;

    proxy_pass http://domisafe_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
}

# --- Resto de la API ----------------------------------------------------------
location /api/ {
    limit_req zone=domisafe_api burst=10 nodelay;
    limit_conn domisafe_conn 8;

    proxy_pass http://domisafe_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
}

# --- Páginas ------------------------------------------------------------------
location / {
    limit_req zone=domisafe_web burst=40 nodelay;
    limit_conn domisafe_conn 16;

    proxy_pass http://domisafe_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# Cuerpos de petición pequeños: aquí no se sube nada.
client_max_body_size 64k;
