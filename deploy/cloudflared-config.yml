# Copiar a /etc/cloudflared/config.yml y sustituir <TUNNEL-UUID>.
# Ver docs/03-cloudflare-tunnel.md para el procedimiento completo.

tunnel: <TUNNEL-UUID>
credentials-file: /root/.cloudflared/<TUNNEL-UUID>.json

# Métricas locales (no expuestas por el túnel)
metrics: 127.0.0.1:20241

# Reintentos y keepalive conservadores: es una línea doméstica.
retries: 5
grace-period: 30s

ingress:
  # Apuntamos a Nginx (443), no a Next.js (3000), para que el tráfico pase
  # obligatoriamente por limit_req y las cabeceras de seguridad.
  - hostname: domisafe.org
    service: https://127.0.0.1:443
    originRequest:
      originServerName: domisafe.org
      httpHostHeader: domisafe.org
      connectTimeout: 10s
      keepAliveConnections: 16
      keepAliveTimeout: 90s

  - hostname: www.domisafe.org
    service: https://127.0.0.1:443
    originRequest:
      originServerName: domisafe.org
      httpHostHeader: domisafe.org

  # Obligatorio: regla final de descarte.
  - service: http_status:404
